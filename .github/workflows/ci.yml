name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DefaultCombat.csproj

      - name: Build
        run: dotnet build DefaultCombat.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test DefaultCombat.csproj --configuration Release --no-build --no-restore
